<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<!-- 퀴즈 검색 버튼 -->

<div class = "search-box">
  <input type="text" id="quiz-search" placeholder ="SEARCH QUIZ...">
</div>




            <!-- 퀴즈 고르는 섹션 -->



<section id = "quiz-section"> 

  <h2 class = "select-game">SELECT GAME</h2>


  <div class="player-login">

    <p id="player-name">
      PLAYER : GUEST
    </p>
  
    <input
      type="text"
      id="nickname"
      maxlength="10"
      placeholder="ENTER PLAYER NAME"
      autocomplete="off"
    >
  
  </div>

 <div class = "game-grid">
  <article class="Moviequiz-card quiz-card">
   <div class = icon>🎬</div>
   <h3> 영화 퀴즈 </h3>
   <p> 영화 배우 사진을 보고 배우를 맞춰라 !</p>
   <div class = difficulty>난이도 ★★★☆☆</div>
   <br>
   <button class="play-button" data-link="quiz-movie/movie-quiz.html">▷ Play</button> 
   <!-- onclick으로 각각 문제들 연결 -->


 </article>


 <article class="Footballquiz-card quiz-card">
  <div class = icon>⚽</div>
  <h3> 축구 퀴즈 </h3>
  <p> 축구 선수 사진을 보고 이름을 맞춰라 !</p>
  <div class = difficulty>난이도 ★★★☆☆</div>
  <br>
  <button class="play-button" data-link="quiz-football/football-quiz.html" >▷ Play</button>


 </article>
 <article class="Mathquiz-card quiz-card">
  <div class = icon>📐</div>
  <h3> 수학 퀴즈 </h3>
  <p> 제한 시간 내에 연산을 빠르게 풀어내라 !</p>
  <div class = difficulty>난이도 ★★★☆☆</div>
  <br>
  <button class="play-button" data-link="math-quiz/math-quizs/math.html" >▷ Play</button>


 </article>
 <article class="Historyquiz-card quiz-card">
  <div class = icon>📖</div>
  <h3> 역사 퀴즈 </h3>
  <p> 영화 배우 사진을 보고 배우를 맞춰라 !</p>
  <div class = difficulty>난이도 ★★★☆☆</div>
  <br>
  <button class="play-button">▷ Play</button>


 </article>

 <article class="Moviequiz-card quiz-card">
  <div class = icon>✝</div>
  <h3> T/F 테스트 </h3>
  <p> 당신이 T인지💔 F인지❤ 아는 방법 !</p>
  <div class = difficulty>난이도 ★★★☆☆</div>
  <br>
  <button class="play-button">▷ Play</button>


 </article>

</div>
<!-- 검색 결과가 없을 때 -->
<div id="no-result">
  <p>👾 NO QUIZ FOUND 👾</p>
  <span>TRY ANOTHER KEYWORD</span>
</div>

</section>

<button class = "back-button" onclick="movePage('../index.html')">
  ◀ BACK
</button>

   
          
    <footer>
    </footer>
    <script src="./user-storage/user-storage.js"></script>
    <script src="./script.js"></script>
    <script src="button-mechanism.js"></script>
</body>
</html>
